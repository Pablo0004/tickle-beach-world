<!doctype html><html><head><meta charset="utf-8"><title>critter</title><style>body{margin:0;background:#9cf}</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script><script src="js/tickle-core.js?v=99"></script><script src="js/sdf.js?v=99"></script>
<script>
const S=1/160; const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth,innerHeight); r.outputEncoding=THREE.sRGBEncoding; document.body.appendChild(r.domElement);
const sc=new THREE.Scene(); sc.background=new THREE.Color(0x9cd0ff); sc.add(new THREE.HemisphereLight(0xffffff,0x777766,1)); const dl=new THREE.DirectionalLight(0xffffff,.6); dl.position.set(3,6,5); sc.add(dl);
function mk(key, vox){ const L=TB.fragmentLayers(key); const v=TB.voxelize(TB.compile(L),{voxel:vox,colors:TB.colorOf}); const md=TB.meshVoxels(v); const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(md.position,3)); g.setAttribute('normal',new THREE.BufferAttribute(md.normal,3,false)); g.setAttribute('color',new THREE.BufferAttribute(md.color,3,true)); g.setIndex(new THREE.BufferAttribute(md.index,1)); const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})); m.scale.setScalar(md.voxel*S); m.position.set(md.origin[0]*S,md.origin[1]*S,md.origin[2]*S); return {m,md,count:v.count}; }
const f=mk('fish',2); const d=mk('duck',4);
const gf=new THREE.Group(); gf.add(f.m); gf.position.set(2.45,0,0.35); sc.add(gf);
const gd=new THREE.Group(); gd.add(d.m); gd.position.set(1.7,0,1.6); sc.add(gd);
const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,50); cam.position.set(0.3,1.0,1.3); cam.lookAt(-0.05,0.05,0.2); r.render(sc,cam);
window.info={fish:f.count, duck:d.count, fmin:f.md.min, fmax:f.md.max, dmin:d.md.min, dmax:d.md.max, fo:f.md.origin, do_:d.md.origin, fv:f.md.voxel};
</script></body></html>
